[tool.poetry]
name = "labyrinth_game"
version = "0.1.0"
description = "Homework for subject \"Base Python\""
authors = ["Iuliia Prusova <prusova.work@gmail.com>"]
packages = [
 { include = "labyrinth_game" },
]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.dev-dependencies]
isort = "^6.1.0"
ruff = "^0.14.0"
pytest = "^8.4.2"
asciinema = "^2.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
project = "labyrinth_game.main:main"

[tool.ruff]
line-length = 79
target-version = "py311"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
